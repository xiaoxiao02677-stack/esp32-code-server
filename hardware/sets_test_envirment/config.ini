# hardware/sets 版本号集中管理
#
# 构建时 build.py 按所选版型读这里的 version，写进 <FW>/CMakeLists.txt 的
# PROJECT_VER 行（IDF app 描述符 / OTA 上报版本的共同来源）。只改一个版型
# 的版本号不会再影响其它版型。
#
# 优先级：[<版型id>] > [default]。编译成功后实际版本会自动回填到对应
# 版型段，所以这里的值永远是"上次构建的真实版本"。
#
# 手动发布新版本：把对应版型（或 default）的 version 改大再构建即可，
# 例如 2.5.2 -> 2.5.3。
# 注释支持：整行 # 与行内 #（如 version = 2.5.2 # 备注）均可，回填时保留。

[default]
version = 2.5.2

[yh-154tft-wifi]
version = 2.5.2

[yh-n16r8-st7789]
version = 2.5.2

[yh-cam]
version = 2.5.2

[yh-big-ili9341]
version = 2.5.2
