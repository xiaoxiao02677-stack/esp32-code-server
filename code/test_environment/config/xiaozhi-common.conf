# ============================================================
# xiaozhi 公共 location（被 9001/9443 与 9002/9444 两个 server 共同 include）
# ------------------------------------------------------------
# 背景：8001 端口由 stream 层按「是否 TLS」分流到两个下游 server：
#   - 明文 ws://    -> 127.0.0.1:9002
#   - TLS  wss:// 与浏览器 https://sandyun.top:8001 -> 127.0.0.1:9444
# 两个 server 必须提供完全相同的站点内容，否则会出现
# 「走 8001 能访问、直连 9443 不能访问」这类半边故障。
# 2026-10-09 曾因为只给新 server 写了 WS 反代 location，
# 导致 https://sandyun.top:8001/ 掉回 nginx 欢迎页、/admincc/ 404。
# 抽成单一来源后，从根上消除「改一处漏一处」。
#
# 只放 location / root / index 这类共享内容；
# listen、ssl_certificate、real_ip 等仍留在各自的 server 块里。
# ============================================================

root /var/www/xiaozhi-manager;
index index.html;

# 设备 WebSocket 反代（外网 8000 未映射，经 nginx 转发到本地 8000）
location /xiaozhi/v1/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # 经 9002/9444 进来时 $remote_addr 已被 realip 还原成设备真实公网 IP；
    # 直连 9001/9443 时 $remote_addr 本身就是真实 IP。两种情况都对。
    proxy_set_header X-Real-IP $remote_addr;
    # 用 $remote_addr 覆盖而非 $proxy_add_x_forwarded_for：
    # 后者会拼接客户端自带的 XFF，Python 取 split(",")[0] 会拿到伪造值
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # 2026-10-09 WS 断连修复：缓冲会攒包，语音流必须逐帧透传
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 10s;
}

# 管理接口透传（设备激活 / OTA / 后台 API 走这里）
location /xiaozhi/ {
    proxy_pass http://127.0.0.1:8002/xiaozhi/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# ===== console-v2：客户端 =====
location = / {
    root /var/www/console-v2/app;
    try_files /index.html =404;
}
location /assets/ {
    root /var/www/console-v2/app;
    try_files $uri =404;
}

# ===== console-v2：管理端 =====
location /admincc/ {
    alias /var/www/console-v2/admin/;
    index index.html;
    try_files $uri $uri/ /admincc/index.html;
}

# ===== console-v2：管理后台 =====
location /admin/ {
    alias /var/www/console-v2/admin/;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
}

# ===== 独立 API 控制台（Kawaii + stylekit 动效）=====
location /cc/ {
    alias /var/www/cc-console/;
    index index.html;
    try_files $uri $uri/ /cc/index.html;
}

location / {
    try_files $uri $uri/ /index.html;
}
