<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>控制台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
      background: #e0e5ec;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 32px 24px;
      text-align: center;
    }
    .header h1 { font-size: 28px; margin-bottom: 8px; }
    .header p { opacity: 0.9; font-size: 14px; }
    .container {
      max-width: 800px;
      margin: -40px auto 40px;
      padding: 0 20px;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: #e0e5ec;
      border-radius: 20px;
      padding: 24px;
      text-decoration: none;
      color: #333;
      box-shadow: 8px 8px 16px #b8bcc2, -8px -8px 16px #ffffff;
      transition: all 0.3s ease;
      display: block;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 12px 12px 24px #b8bcc2, -12px -12px 24px #ffffff;
    }
    .card:active {
      box-shadow: inset 6px 6px 12px #b8bcc2, inset -6px -6px 12px #ffffff;
    }
    .card-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 16px;
      box-shadow: inset 4px 4px 8px #b8bcc2, inset -4px -4px 8px #ffffff;
    }
    .card-icon.order { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .card-icon.home { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1a1a2e;
    }
    .card-desc {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }
    .card-arrow {
      margin-top: 16px;
      color: #667eea;
      font-size: 20px;
      text-align: right;
    }
    .footer {
      text-align: center;
      padding: 24px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>屿禾工坊控制台</h1>
    <p>管理后台 · 选择功能模块</p>
  </div>
  
  <div class="container">
    <div class="card-grid">
      <a href="/orders" class="card">
        <div class="card-icon order">📦</div>
        <div class="card-title">订单管理</div>
        <div class="card-desc">查看和管理订单数据，支持自定义字段、拖拽排序、导出数据</div>
        <div class="card-arrow">›</div>
      </a>
      
      <a href="/" class="card">
        <div class="card-icon home">🏠</div>
        <div class="card-title">返回首页</div>
        <div class="card-desc">回到屿禾工坊主页，浏览产品与服务</div>
        <div class="card-arrow">›</div>
      </a>
    </div>
  </div>
  
  <div class="footer">
    © 2026 屿禾工坊 · 测试环境
  </div>
</body>
</html>
