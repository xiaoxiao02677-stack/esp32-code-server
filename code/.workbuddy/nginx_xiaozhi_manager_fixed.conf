server {
    listen 9001;
    listen 8443 ssl;
    listen 9443 ssl;
    ssl_certificate /etc/nginx/ssl/sandyun.top.crt;
    ssl_certificate_key /etc/nginx/ssl/sandyun.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;

    root /var/www/xiaozhi-manager;
    index index.html;

    # 设备 WebSocket 反代 (外网 8000 未映射, 经 nginx 转发到本地 8000)
    location /xiaozhi/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 2026-10-09 WS 断连修复：缓冲会攒包，语音流必须逐帧透传
        proxy_buffering off;
        proxy_request_buffering off;
        # 建连超时显式化（默认 60s 过长，WS 握手不该等这么久）
        proxy_connect_timeout 10s;
    }

    location /xiaozhi/ {
        proxy_pass http://127.0.0.1:8002/xiaozhi/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===== console-v2 双端点（2026-10-08 部署）=====
    # 2026-10-09 修复：此块曾被重复粘贴 3 份，导致 duplicate location "/"
    # nginx -t 失败、reload 无法执行、服务器重启后 nginx 将直接起不来。
    # 已去重为一份。后续部署请幂等写入，不要重复 append。
    # 客户端 /
    location = / {
        root /var/www/console-v2/app;
        try_files /index.html =404;
    }
    location /assets/ {
        root /var/www/console-v2/app;
        try_files $uri =404;
    }
    # 管理端 /admincc/
    location /admincc/ {
        alias /var/www/console-v2/admin/;
        index index.html;
        try_files $uri $uri/ /admincc/index.html;
    }

    # 独立 API 控制台（全新项目，Kawaii + stylekit 动效）
    location /cc/ {
        alias /var/www/cc-console/;
        index index.html;
        try_files $uri $uri/ /cc/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
