# xiaozhi 服务日志轮转
#
# 背景：systemd 单元用 StandardOutput=append:<file> 直接持有文件描述符，
# 默认日志在重启时被截断丢失现场。这里保证：
#   1) 单元本身是 append:（追加，不覆盖）
#   2) 这里做按天轮转 + 压缩留档，避免单文件无限膨胀
#      （实测 manager-api.log 一度 65MB、app.log 6MB 且从不轮转）
#
# 关键：必须用 copytruncate。
#   默认的 create 会 rename 旧文件再新建同名文件，但 systemd 持有的仍是
#   旧 inode，会继续往已被 rename 的文件里写 —— 表面上"轮转了"，
#   实际新文件永远是空的，旧文件继续膨胀直到磁盘满。
#   copytruncate 是「拷贝一份留档，然后原地截断」，fd 不变，systemd 无感。
#
# tmp/server.log 不在本配置内：它由 loguru 自己按 10MB 轮转、保留 30 天，
# 再交给 logrotate 会和 loguru 的 rotation 抢文件。

/root/xiaozhi-server/main/xiaozhi-server/data/app.log
/opt/xiaozhi/manager-api.log
{
    daily
    rotate 14
    maxsize 200M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
    su root root
}
