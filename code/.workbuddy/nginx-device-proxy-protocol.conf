# ============================================================
# 8001 端口的下游 server（PROXY protocol 版）
# ------------------------------------------------------------
# 目的：让设备 WebSocket 日志里出现真实公网 IP，而不是一律 127.0.0.1，
#       从而可以按设备 IP 定位问题。
#
# 链路：
#   设备/浏览器 -> nginx stream:8001 (ssl_preread 按是否 TLS 分流)
#        -> [PROXY protocol 头里携带客户端真实 IP]
#        -> 本 server 127.0.0.1:9002(明文) / 9444(TLS)，listen 带 proxy_protocol
#        -> realip 模块把 $remote_addr 还原成真实 IP
#        -> proxy_set_header X-Real-IP $remote_addr
#        -> Python 8000，core/connection.py:212 已读取 x-real-ip（无需改代码）
#
# 为什么用独立端口 9002/9444，而不直接给 9001/9443 加 proxy_protocol：
#   9001/9443 是公网直连端口，实测有 censys / infrawat.ch / Go-http-client
#   等扫描流量；一旦在这些端口上开 proxy_protocol，所有不发 PROXY 头的
#   直连都会握手失败。独立端口且只绑 127.0.0.1：
#     - 对现有 9001/9443 零影响（直连时 $remote_addr 本来就是真 IP）
#     - 不新增公网暴露面
#     - 出问题只要把 stream 的 map 改回 127.0.0.1:9001 / 9443 即可秒级回滚
#
# !! 重要 !! 本块是 xiaozhi-manager 的「完整副本」，不是只放 WS 反代。
#   8001 的 HTTPS 同时承载管理后台网页（/ 、/admincc/、/cc/、/assets/），
#   只写 WS location 会让 https://sandyun.top:8001/ 掉回 nginx 欢迎页
#   （2026-10-09 首次部署踩过这个坑）。后续改 xiaozhi-manager 时，
#   这里的 location 必须同步。
# ============================================================
server {
    # 明文：ws:// 设备（stream 判定为非 TLS 时转发到这里）
    listen 127.0.0.1:9002 proxy_protocol;
    # TLS ：wss:// 设备 + 浏览器 https://sandyun.top:8001
    listen 127.0.0.1:9444 ssl proxy_protocol;

    ssl_certificate /etc/nginx/ssl/sandyun.top.crt;
    ssl_certificate_key /etc/nginx/ssl/sandyun.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;

    # 只信任来自本机 stream 层转发的 PROXY 头，避免外部伪造
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    root /var/www/xiaozhi-manager;
    index index.html;

    # 设备 WebSocket 反代 (外网 8000 未映射, 经 nginx 转发到本地 8000)
    location /xiaozhi/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # 此时 $remote_addr 已被 realip 还原为客户端真实公网 IP
        proxy_set_header X-Real-IP $remote_addr;
        # 用 $remote_addr 覆盖而非 $proxy_add_x_forwarded_for：
        # 后者会拼接客户端自带的 XFF，Python 取 split(",")[0] 会拿到伪造值
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 2026-10-09 WS 断连修复：缓冲会攒包，语音流必须逐帧透传
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
    }

    location /xiaozhi/ {
        proxy_pass http://127.0.0.1:8002/xiaozhi/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # ===== console-v2 双端点 =====
    # 客户端 /
    location = / {
        root /var/www/console-v2/app;
        try_files /index.html =404;
    }
    location /assets/ {
        root /var/www/console-v2/app;
        try_files $uri =404;
    }
    # 管理端 /admincc/
    location /admincc/ {
        alias /var/www/console-v2/admin/;
        index index.html;
        try_files $uri $uri/ /admincc/index.html;
    }

    # 独立 API 控制台（Kawaii + stylekit 动效）
    location /cc/ {
        alias /var/www/cc-console/;
        index index.html;
        try_files $uri $uri/ /cc/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
