# ============================================================
# 原始站点 server（9001 / 8443 / 9443）
# ------------------------------------------------------------
# 公共 location 已抽到 /etc/nginx/snippets/xiaozhi-common.conf，
# 与 9002/9444 那个 server 共用同一份，改一处两边同时生效。
#
# 2026-10-09 端口收敛：9001 与 9443 收为仅本机监听。
#   依据：stream:8001 的下游已改指 9002/9444（带 PROXY protocol）；
#   历史访问日志（近 5 天、9796 条 host:port 记录）中只出现过
#   sandyun.top:8001，9001/9443/8443 从无外部直连记录。
#   收掉后可避免绕过 8001 直接打到后端。
# 回滚：把下面两行改回 listen 9001; / listen 9443 ssl; 即可。
# ============================================================
server {
    listen 127.0.0.1:9001;
    listen 8443 ssl;
    listen 127.0.0.1:9443 ssl;

    ssl_certificate /etc/nginx/ssl/sandyun.top.crt;
    ssl_certificate_key /etc/nginx/ssl/sandyun.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_name _;

    include /etc/nginx/snippets/xiaozhi-common.conf;
}
