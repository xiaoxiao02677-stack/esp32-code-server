<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 64" width="360" height="64">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F8EF7"/>
      <stop offset="100%" style="stop-color:#1A56DB"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F8EF7;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#1A56DB;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6DB3F8;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1A56DB;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#glowGrad)" opacity="0.5"/>
  <polyline points="14,22 26,16 38,20 34,32 40,39 47,45 53,50"
    fill="none" stroke="url(#lineGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="38" y1="20" x2="14" y2="22" stroke="url(#lineGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
  <g transform="translate(14,22)" filter="url(#glow)">
    <circle r="3.2" fill="url(#starGrad)"/>
    <circle r="1.2" fill="white" opacity="0.8"/>
  </g>
  <g transform="translate(26,16)" filter="url(#glow)">
    <circle r="2.8" fill="url(#starGrad)"/>
    <circle r="1" fill="white" opacity="0.8"/>
  </g>
  <g transform="translate(38,20)" filter="url(#glow)">
    <circle r="3.5" fill="url(#starGrad)"/>
    <circle r="1.3" fill="white" opacity="0.8"/>
  </g>
  <g transform="translate(34,32)" filter="url(#glow)">
    <circle r="3" fill="url(#starGrad)"/>
    <circle r="1.1" fill="white" opacity="0.8"/>
  </g>
  <g transform="translate(40,39)" filter="url(#glow)">
    <circle r="2.6" fill="url(#starGrad)"/>
    <circle r="1" fill="white" opacity="0.8"/>
  </g>
  <g transform="translate(47,45)" filter="url(#glow)">
    <circle r="3.2" fill="url(#starGrad)"/>
    <circle r="1.2" fill="white" opacity="0.8"/>
  </g>
  <g transform="translate(53,50)" filter="url(#glow)">
    <circle r="4" fill="url(#starGrad)"/>
    <circle r="1.5" fill="white" opacity="0.9"/>
    <line x1="0" y1="-6" x2="0" y2="-4.5" stroke="#4F8EF7" stroke-width="0.8" opacity="0.5"/>
    <line x1="5" y1="-2" x2="4" y2="-1" stroke="#4F8EF7" stroke-width="0.8" opacity="0.5"/>
    <line x1="-5" y1="-2" x2="-4" y2="-1" stroke="#4F8EF7" stroke-width="0.8" opacity="0.5"/>
  </g>
  <circle cx="20" cy="12" r="0.8" fill="#4F8EF7" opacity="0.4"/>
  <circle cx="44" cy="14" r="0.6" fill="#4F8EF7" opacity="0.3"/>
  <circle cx="10" cy="36" r="0.7" fill="#4F8EF7" opacity="0.35"/>
  <circle cx="48" cy="54" r="0.5" fill="#1A56DB" opacity="0.3"/>
  <text x="72" y="42" font-family="'Outfit', 'Noto Sans SC', 'PingFang SC', sans-serif" font-size="34" font-weight="700" fill="#1A2D5A" letter-spacing="3">
    小七星链
  </text>
</svg>
