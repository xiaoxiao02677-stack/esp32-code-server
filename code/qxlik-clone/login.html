<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="img/icon.svg">
  <link href="css/local-fonts.css" rel="stylesheet">
  <title>小七星链</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css?v=20261027a">
  <link rel="stylesheet" href="css/layout-fix.css?v=20261027a">
</head>
<body>
  <div id="app">
    <div class="login-page">
      <div class="login-container">

        <!-- 品牌面板 -->
        <div class="brand-panel">
          <div class="brand-content">
            <img class="brand-logo" src="img/icon.svg" alt="小七星链">
            <h1 class="brand-title">小七星链</h1>
            <p class="brand-desc">Connect Ai · 智能物联网管理平台</p>
            <div class="brand-features">
              <div class="feature-item"><span class="feature-dot"></span>多智能体对话管理</div>
              <div class="feature-item"><span class="feature-dot"></span>设备实时监控</div>
              <div class="feature-item"><span class="feature-dot"></span>角色与记忆配置</div>
            </div>
          </div>
          <!-- 星座装饰 SVG -->
          <svg class="constellation-deco" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g stroke="#4F8EF7" stroke-width="1">
              <line x1="20" y1="160" x2="55" y2="130"/>
              <line x1="55" y1="130" x2="80" y2="150"/>
              <line x1="55" y1="130" x2="90" y2="90"/>
              <line x1="90" y1="90" x2="130" y2="100"/>
              <line x1="90" y1="90" x2="110" y2="55"/>
              <line x1="110" y1="55" x2="150" y2="40"/>
              <line x1="150" y1="40" x2="175" y2="60"/>
              <line x1="130" y1="100" x2="160" y2="120"/>
              <line x1="160" y1="120" x2="140" y2="160"/>
              <line x1="80" y1="150" x2="105" y2="180"/>
            </g>
            <g fill="#4F8EF7">
              <circle cx="20" cy="160" r="3"/>
              <circle cx="55" cy="130" r="3.5"/>
              <circle cx="80" cy="150" r="2.5"/>
              <circle cx="90" cy="90" r="3"/>
              <circle cx="130" cy="100" r="2.5"/>
              <circle cx="110" cy="55" r="3.5"/>
              <circle cx="150" cy="40" r="3"/>
              <circle cx="175" cy="60" r="2.5"/>
              <circle cx="160" cy="120" r="2.5"/>
              <circle cx="140" cy="160" r="3"/>
              <circle cx="105" cy="180" r="2.5"/>
            </g>
          </svg>
        </div>

        <!-- 表单面板 -->
        <div class="form-panel">
          <div class="form-header">
            <h2 class="form-title">登录</h2>
            <p class="form-subtitle">请输入 yuhe 主站账号（需属于 proxys 组）</p>
          </div>

          <form class="login-form" id="login-form">
            <div class="form-item">
              <label>用户名</label>
              <div class="login-input">
                <span class="input-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </span>
                <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
              </div>
            </div>

            <div class="form-item">
              <label>密码</label>
              <div class="login-input">
                <span class="input-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </span>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
                <button type="button" class="toggle-pwd" id="toggle-pwd" aria-label="显示密码">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <div class="form-options">
              <label class="remember-me">
                <input type="checkbox" id="remember"> 记住我
              </label>
              <a class="link-accent" href="javascript:void(0)">忘记密码</a>
            </div>

            <button type="submit" class="submit-btn">登录</button>

            <p class="privacy-terms">
              登录即表示您同意<a href="javascript:void(0)">《隐私协议》</a>和<a href="javascript:void(0)">《服务条款》</a>
            </p>
          </form>

          <div class="divider-line"><span>其他方式登录</span></div>

          <div class="social-row">
            <button class="social-btn" title="微信">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 4C4.9 4 2 6.6 2 9.8c0 1.8.9 3.4 2.3 4.5l-.6 2 2.2-1.1c.8.2 1.7.4 2.6.4h.4a5.6 5.6 0 0 1-.2-1.5c0-3.2 2.8-5.8 6.3-5.8h.3C14.6 5.8 11.8 4 8.5 4zM6.8 8.2a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8zm3.4 0a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8zm11.8 5.9c0-2.7-2.4-4.9-5.3-4.9s-5.3 2.2-5.3 4.9 2.4 4.9 5.3 4.9c.6 0 1.2-.1 1.8-.3l2 1-.5-1.8c1.1-.9 2-2 2-2.8zm-6.9-1.6a.8.8 0 1 1 0-1.6.8.8 0 0 1 0 1.6zm3.2 0a.8.8 0 1 1 0-1.6.8.8 0 0 1 0 1.6z"/></svg>
            </button>
            <button class="social-btn" title="QQ">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C7 2 4.5 5 4.5 8.6c0 2.1 1 3.9 2.6 5-.6 1.4-2 2.7-3.6 3.7 2.3.2 4.2-.7 5.3-1.6.9.3 1.9.5 3.2.5s2.3-.2 3.2-.5c1.1.9 3 1.8 5.3 1.6-1.6-1-3-2.3-3.6-3.7 1.6-1.1 2.6-2.9 2.6-5C19.5 5 17 2 12 2z"/></svg>
            </button>
            <button class="social-btn" title="GitHub">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.2-3.4-1.2-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.6 1 1.6 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5a3.9 3.9 0 0 1 1-2.7 3.6 3.6 0 0 1 .1-2.7s.9-.3 2.8 1a9.4 9.4 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1a3.6 3.6 0 0 1 .1 2.7 3.9 3.9 0 0 1 1 2.7c0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg>
            </button>
          </div>

          <p class="register-row" style="color:#71717A;">账号在主站注册后，需管理员将其加入 proxys 角色组方可登录本站</p>
        </div>

      </div>
    </div>
  </div>

  <script src="js/theme.js?v=20261026d"></script>
  <script src="js/auth.js?v=20261026d"></script>
  <script src="js/login.js?v=20261026d"></script>
<script src="js/layout-fix.js?v=20261026d"></script>
</body>
</html>
